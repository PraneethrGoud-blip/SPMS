<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMS Dashboard</title>

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<style>
body{
    margin:0;
    background:white;
    font-family:Arial, sans-serif;
}

.navbar-custom{
    background:grey;
    padding:5px 15px;
}
.navbar-custom .navbar-brand,
.navbar-custom span{
    color:whitesmoke;
    font-size:13px;
}

.sidebar{
    background:black;
    min-height:100vh;
}
.sidebar a{
    display:block;
    color: whitesmoke;
    padding:10px 15px;
    font-size:13px;
    text-decoration:none;
}
.sidebar a:hover,
.sidebar .active{
    background:grey;
    color:white;
}

.stat-box{
    color:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:5px;
    text-align:center;
}

.stat-box h3{
    margin:0;
    font-size:24px;
}
.stat-box p{
    margin:5px 0 0;
    font-size:13px;
}

.bg1{background:goldenrod;}
.bg2{background:grey;}
.bg3{background:red;}
.bg4{background:orange;}
.bg5{background:gray;}
.bg6{background:blue;}

</style>
</head>

<body>
<nav class="navbar navbar-custom d-flex align-items-center">
    <button class="btn btn-light btn-sm d-md-none mr-2"
            type="button"
            data-toggle="collapse"
            data-target="#sidebarMenu">
        ☰
    </button>

    <a class="navbar-brand" href="#">PMS Panel</a>

    <span class="ml-auto">Welcome, Administrator</span>
    <a href="index.html" class="btn btn-primary btn-sm ml-2">Logout</a>
</nav>

<div class="container-fluid">
<div class="row">
    <div class="col-12 col-md-3 col-lg-2 p-0">
        <div class="collapse d-md-block sidebar" id="sidebarMenu">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="category.html">Category</a>
            <a href="VehicleEntry.html">Vehicle Entry</a>
            <a href="ManageVehicle.html">Manage Vehicles</a>
            <a href="Reports.html">Reports</a>
            <a href="search.html">Search</a>
            <a href="Account Settings.html">Account Setting</a>
            <a href="index.html">Logout</a>
        </div>
    </div>
    <div class="col-12 col-md-9 col-lg-10 p-3">
        <div class="row">
            <div class="col-12 col-sm-6 col-lg-4">
                <div class="stat-box bg1">
                    <h3>1</h3>
                    <p>Vehicles Parked</p>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="stat-box bg2">
                    <h3>2</h3>
                    <p>Departed Vehicles</p>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="stat-box bg3">
                    <h3>6</h3>
                    <p>Available Category</p>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="stat-box bg4">
                    <h3>$18.00</h3>
                    <p>Total Earnings</p>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="stat-box bg5">
                    <h3>3</h3>
                    <p>Total Records</p>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="stat-box bg6">
                    <h3>74</h3>
                    <p>Total Parking Slots</p>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
